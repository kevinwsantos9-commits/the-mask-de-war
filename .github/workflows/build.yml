name: Build The Masked Morte Shadows

on:
  push:
    branches: ["main", "master"]
    paths:
      - "src/**"
      - "gradle.properties"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/**"
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: masked-morte-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile mod (Minecraft 1.21.1)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          cache-cleanup: on-success

      - name: Show environment
        run: |
          java -version
          gradle --version

      - name: Build mod
        run: gradle --no-daemon clean build

      - name: Check generated JAR
        if: success()
        run: |
          test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          ls -lh build/libs/*.jar

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TheMaskedMorte-Shadows-Minecraft-1.21.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload source JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TheMaskedMorte-Shadows-Sources
          path: build/libs/*-sources.jar
          if-no-files-found: ignore
          retention-days: 7
